<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWE Salary Comparison: Seoul → Toronto → Silicon Valley</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
        }

        .city-box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            min-width: 280px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .city-box:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
        }

        .city-name {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .skyline {
            width: 100%;
            height: 200px;
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
            object-fit: cover;
            display: block;
        }

        .skyline img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .rank-image {
            width: 50%;
            max-width: 600px;
            margin-top: 40px;
            display: block;
        }

        .rank-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .income {
            margin-top: 20px;
            font-size: 24px;
            font-weight: 600;
            color: #2e7d32;
        }

        .income-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .arrow {
            font-size: 48px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        @media (max-width: 968px) {
            .container {
                flex-direction: column;
            }
            .arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Seoul -->
        <div class="city-box">
            <div class="city-name">Seoul</div>
            <div class="skyline">
                <img src="seoul.jpg" alt="Seoul Skyline" />
            </div>
            <div class="income">$45,000</div>
            <div class="income-label">Median SWE Income</div>
        </div>

        <div class="arrow">→</div>

        <!-- Toronto -->
        <div class="city-box">
            <div class="city-name">Toronto</div>
            <div class="skyline">
                <img src="toronto.jpg" alt="Toronto Skyline" />
            </div>
            <div class="income">$72,000</div>
            <div class="income-label">Median SWE Income</div>
        </div>

        <div class="arrow">→</div>

        <!-- Silicon Valley -->
        <div class="city-box">
            <div class="city-name">Silicon Valley</div>
            <div class="skyline">
                <img src="sv.webp" alt="Silicon Valley Skyline" />
            </div>
            <div class="income">$150,000</div>
            <div class="income-label">Median SWE Income</div>
        </div>
    </div>
    <div class="rank-image">
        <img src="rank.png" alt="Rank" />
    </div>
</body>
</html>
